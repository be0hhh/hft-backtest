name: local-ci

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: /home/gha-runner/github-actions/bin/gha-heavy-shell {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: /home/gha-runner/github-actions/cache/ccache
  CCACHE_MAXSIZE: 15G
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_PARALLEL_LEVEL: 4
  PATH: /usr/bin:/bin:/usr/sbin:/sbin

jobs:
  resolve-family-revisions:
    name: resolve-family-revisions
    runs-on: [self-hosted, linux, x64, wsl, benchmark, hft-bench, hft-backtest]
    timeout-minutes: 10
    outputs:
      cxetcpp_sha: ${{ steps.snapshot.outputs.cxetcpp_sha }}
      hft_recorder_sha: ${{ steps.snapshot.outputs.hft_recorder_sha }}
      trading_core_sha: ${{ steps.snapshot.outputs.trading_core_sha }}
    steps:
      - name: Checkout revision resolver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/CXETCPP
          ref: main
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          sparse-checkout: .github/actions/resolve-family-revisions
          persist-credentials: false

      - name: Snapshot family main revisions
        id: snapshot
        uses: ./.github/actions/resolve-family-revisions
        with:
          family-read-token: ${{ secrets.CI_FAMILY_READ_TOKEN }}

  hft-backtest:
    name: hft-backtest
    needs: resolve-family-revisions
    runs-on: [self-hosted, linux, x64, wsl, local-ci, hft-backtest]
    timeout-minutes: 180

    steps:
      - name: Checkout snapshotted CXETCPP root
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/CXETCPP
          ref: ${{ needs.resolve-family-revisions.outputs.cxetcpp_sha }}
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          submodules: true
          path: source/CXETCPP
          persist-credentials: false

      - name: Overlay snapshotted trading-core revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/trading-core
          ref: ${{ needs.resolve-family-revisions.outputs.trading_core_sha }}
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          path: source/CXETCPP/apps/trading-core
          persist-credentials: false

      - name: Overlay snapshotted hft-recorder revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/hft-recorder
          ref: ${{ needs.resolve-family-revisions.outputs.hft_recorder_sha }}
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          path: source/CXETCPP/apps/hft-recorder
          persist-credentials: false

      - name: Overlay triggering hft-backtest revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          path: source/CXETCPP/apps/hft-backtest
          persist-credentials: false

      - name: Record source revisions
        run: |
          root_sha="$(git -C source/CXETCPP rev-parse HEAD)"
          trading_core_sha="$(git -C source/CXETCPP/apps/trading-core rev-parse HEAD)"
          recorder_sha="$(git -C source/CXETCPP/apps/hft-recorder rev-parse HEAD)"
          app_sha="$(git -C source/CXETCPP/apps/hft-backtest rev-parse HEAD)"
          printf 'CXETCPP root: %s\ntrading-core: %s\nhft-recorder: %s\nhft-backtest overlay: %s\n' "$root_sha" "$trading_core_sha" "$recorder_sha" "$app_sha"
          {
            echo "### Source revisions"
            echo "| Source | Commit |"
            echo "| --- | --- |"
            printf '| CXETCPP root | %s |\n' "$root_sha"
            printf '| trading-core snapshot | %s |\n' "$trading_core_sha"
            printf '| hft-recorder snapshot | %s |\n' "$recorder_sha"
            printf '| hft-backtest overlay | %s |\n' "$app_sha"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```text'
            git -C source/CXETCPP submodule status
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Set up pinned LLVM
        uses: ./source/CXETCPP/.github/actions/setup-toolchain
        with:
          source-root: source/CXETCPP

      - name: Report CMake and CTest binaries
        run: |
          /usr/bin/cmake --version
          /usr/bin/ctest --version

      - name: Build hft-backtest and its offline tests
        working-directory: source/CXETCPP/apps/hft-backtest
        run: ./compile.sh --force all low portable p

      - name: Run hft-backtest offline tests
        run: >-
          /usr/bin/ctest
          --test-dir source/CXETCPP/build
          -L '^hft-backtest$'
          --output-on-failure
          --no-tests=error
          --timeout 180
