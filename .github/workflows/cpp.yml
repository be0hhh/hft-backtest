name: cpp

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PATH: /usr/bin:/bin:/usr/sbin:/sbin

jobs:
  hft-backtest:
    name: hft-backtest
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Require private CXETCPP checkout token
        env:
          CI_FAMILY_READ_TOKEN: ${{ secrets.CI_FAMILY_READ_TOKEN }}
        run: |
          if [ -z "$CI_FAMILY_READ_TOKEN" ]; then
            {
              echo "### Private root checkout unavailable"
              echo "CI_FAMILY_READ_TOKEN is required to compose hft-backtest in the CXETCPP root graph."
              echo "Pull requests from forks do not receive this secret, so this run cannot provide a passing build result."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::CI_FAMILY_READ_TOKEN is required for the private CXETCPP root checkout"
            exit 1
          fi

      - name: Checkout CXETCPP root and pinned dependencies
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/CXETCPP
          ref: main
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          submodules: true
          path: source/CXETCPP
          persist-credentials: false

      - name: Overlay triggering hft-backtest revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: source/CXETCPP/apps/hft-backtest
          persist-credentials: false

      - name: Record source revisions
        run: |
          root_sha="$(git -C source/CXETCPP rev-parse HEAD)"
          app_sha="$(git -C source/CXETCPP/apps/hft-backtest rev-parse HEAD)"
          printf 'CXETCPP root: %s\nhft-backtest overlay: %s\n' "$root_sha" "$app_sha"
          {
            echo "### Source revisions"
            echo "| Source | Commit |"
            echo "| --- | --- |"
            printf '| CXETCPP root | %s |\n' "$root_sha"
            printf '| hft-backtest overlay | %s |\n' "$app_sha"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```text'
            git -C source/CXETCPP submodule status
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install root-graph build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            clang \
            cmake \
            curl \
            python3 \
            libssl-dev \
            ninja-build \
            pkg-config \
            python3 \
            ripgrep

      - name: Set up pinned LLVM
        uses: ./source/CXETCPP/.github/actions/setup-toolchain
        with:
          source-root: source/CXETCPP

      - name: Report CMake and CTest binaries
        run: |
          /usr/bin/cmake --version
          /usr/bin/ctest --version

      - name: Build hft-backtest and its offline tests
        working-directory: source/CXETCPP/apps/hft-backtest
        run: ./compile.sh --force all low portable p

      - name: Run hft-backtest offline tests
        run: >-
          /usr/bin/ctest
          --test-dir source/CXETCPP/build
          -L '^hft-backtest$'
          --output-on-failure
          --no-tests=error
          --timeout 180
